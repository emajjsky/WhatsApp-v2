services:
  postgres:
    image: postgres:16-alpine
    container_name: whatsapp-agent-platform-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: whatsapp_agent_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - whatsapp_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d whatsapp_agent_platform"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  whatsapp_postgres_data:
